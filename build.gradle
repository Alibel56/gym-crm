plugins {
    id 'java'
    id 'war'
}

group = 'com.practice'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

war {
    archiveFileName = 'gym.war'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

ext {
    springVersion = '6.1.14'
    jacksonVersion = '2.17.2'
    hibernateVersion = '6.3.0.Final'
    junitVersion = '5.13.4'
    mockitoVersion = '5.20.0'
}

dependencies {
    // Spring
    implementation "org.springframework:spring-context:$springVersion"
    implementation "org.springframework:spring-webmvc:$springVersion"
    implementation "org.springframework:spring-orm:$springVersion"
    implementation "org.springframework:spring-aop:$springVersion"
    implementation "org.springframework:spring-tx:$springVersion"

    // Hibernate
    implementation "org.hibernate.orm:hibernate-core:$hibernateVersion"

    // Database
    implementation "org.postgresql:postgresql:42.6.0"

    // Jakarta APIs
    implementation "jakarta.annotation:jakarta.annotation-api:3.0.0"
    implementation "jakarta.persistence:jakarta.persistence-api:3.1.0"
    implementation "jakarta.validation:jakarta.validation-api:3.0.2"

    // Tomcat предоставляет Servlet API
    providedCompile "jakarta.servlet:jakarta.servlet-api:6.0.0"

    // Bean Validation implementation
    implementation "org.hibernate.validator:hibernate-validator:8.0.4.Final"

    // Нужна Hibernate Validator для интерполяции сообщений
    implementation "org.glassfish:jakarta.el:4.0.2"

    // Jackson
    implementation "com.fasterxml.jackson.core:jackson-databind:$jacksonVersion"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:$jacksonVersion"

    // Logging
    implementation "org.slf4j:slf4j-api:2.0.17"
    implementation "ch.qos.logback:logback-classic:1.5.18"

    // AOP
    implementation "org.aspectj:aspectjweaver:1.9.22.1"

    // Lombok
    compileOnly "org.projectlombok:lombok:1.18.38"
    annotationProcessor "org.projectlombok:lombok:1.18.38"

    testCompileOnly "org.projectlombok:lombok:1.18.38"
    testAnnotationProcessor "org.projectlombok:lombok:1.18.38"

    // Swagger annotations
    implementation "io.swagger.core.v3:swagger-annotations-jakarta:2.2.31"

    // Tests
    testImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.13.4"

    testImplementation "org.mockito:mockito-core:$mockitoVersion"
    testImplementation "org.mockito:mockito-junit-jupiter:$mockitoVersion"

    testImplementation "org.assertj:assertj-core:3.27.6"
    testImplementation "org.springframework:spring-test:$springVersion"
    testImplementation "org.hamcrest:hamcrest:3.0"
    testImplementation "com.h2database:h2:2.4.240"
}

tasks.named('test') {
    useJUnitPlatform()
}