spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=task1}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

hibernate:
  dialect: org.hibernate.dialect.PostgreSQLDialect
  hbm2ddl:
    auto: validate
  show_sql: false
  format_sql: false

logging:
  level:
    root: INFO
    com.practice: INFO
    org.hibernate.SQL: WARN

jms:
  queue:
    training-workload: ${JMS_TRAINING_WORKLOAD_QUEUE:training-workload-stg}
