spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=task1}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}

hibernate:
  dialect: org.hibernate.dialect.PostgreSQLDialect
  hbm2ddl:
    auto: create-drop
  show_sql: true
  format_sql: true

logging:
  level:
    root: INFO
    com.practice: DEBUG
    org.hibernate.SQL: DEBUG

jms:
  queue:
    training-workload: ${JMS_TRAINING_WORKLOAD_QUEUE:training-workload-local}
