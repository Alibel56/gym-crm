spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}

hibernate:
  dialect: org.hibernate.dialect.PostgreSQLDialect
  hbm2ddl:
    auto: validate
  show_sql: false
  format_sql: false

logging:
  level:
    root: WARN
    com.practice: INFO
    org.hibernate.SQL: WARN

management:
  endpoint:
    health:
      show-details: when-authorized

jms:
  queue:
    training-workload: ${JMS_TRAINING_WORKLOAD_QUEUE:training-workload-prod}
