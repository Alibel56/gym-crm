spring:
  application:
    name: gym-crm

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    driver-class-name: org.postgresql.Driver

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

  activemq:
    broker-url: ${ACTIVEMQ_URL:tcp://localhost:61616}
    user: ${ACTIVEMQ_USER:admin}
    password: ${ACTIVEMQ_PASSWORD:admin}

jms:
  queue:
    training-workload: ${JMS_TRAINING_WORKLOAD_QUEUE:training-workload}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /gym

hibernate:
  show_sql: false
  format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    status:
      order: DOWN, DEGRADED, OUT_OF_SERVICE, UNKNOWN, UP
      http-mapping:
        DEGRADED: 200

  metrics:
    tags:
      application: ${spring.application.name}

  prometheus:
    metrics:
      export:
        enabled: true

info:
  app:
    name: Gym CRM
    description: Trainee / Trainer / Training management REST API

security:
  jwt:
    secret: ${JWT_SECRET:VGhpc0lzQURldmVsb3BtZW50T25seVNlY3JldEtleUZvckd5bUNybUFwaQ==}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5500}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true