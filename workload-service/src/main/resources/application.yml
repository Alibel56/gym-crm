spring:
  application:
    name: workload-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  activemq:
    broker-url: ${ACTIVEMQ_URL:tcp://localhost:61616}
    user: ${ACTIVEMQ_USER:admin}
    password: ${ACTIVEMQ_PASSWORD:admin}

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/workload_service}

jms:
  queue:
    training-workload: ${JMS_TRAINING_WORKLOAD_QUEUE:training-workload}
  listener:
    concurrency: ${JMS_LISTENER_CONCURRENCY:3-10}

server:
  port: ${SERVER_PORT:8081}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true

security:
  jwt:
    secret: ${JWT_SECRET:VGhpc0lzQURldmVsb3BtZW50T25seVNlY3JldEtleUZvckd5bUNybUFwaQ==}

management:
  endpoints:
    web:
      exposure:
        include: health,info